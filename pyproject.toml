[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nba-predictor-streamlit"
version = "2.0.0"
description = "Advanced NBA predictive analytics system with real-time data integration and betting odds analysis"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "NBA Predictor Team", email = "team@example.com"}
]
maintainers = [
    {name = "NBA Predictor Team", email = "team@example.com"}
]
keywords = [
    "nba",
    "basketball",
    "analytics",
    "prediction",
    "streamlit",
    "odds",
    "betting",
    "machine-learning",
    "data-science"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.11"
dependencies = [
    # Core Streamlit and web framework
    "streamlit>=1.28.0",
    "gunicorn>=21.0.0",
    "watchdog>=3.0.0",

    # Modern data processing and analytics
    "polars>=1.0.0",
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",

    # Visualization and plotting
    "plotly>=5.15.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",

    # HTTP clients and API integration
    "httpx>=0.24.0",
    "requests>=2.31.0",

    # NBA API and data sources
    "nba-api>=1.1.0",

    # Web scraping and HTML processing
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "html5lib>=1.1",
    "selenium>=4.15.0",

    # Machine learning and analytics
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "shap>=0.42.0",
    "xgboost>=1.7.0",

    # Data utilities
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    "python-dotenv>=1.0.0",
    "packaging>=23.0",
    "protobuf>=4.21.0",

    # Database and async support
    "sqlalchemy>=2.0.0",
    "apscheduler>=3.10.0",

    # Monitoring and notifications
    "python-telegram-bot>=20.0",
]

[project.optional-dependencies]
dev = [
    # Testing framework
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",

    # Code quality and formatting
    "black>=23.7.0",
    "ruff>=0.0.280",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "types-python-dateutil>=2.8.0",
    "types-requests>=2.31.0",

    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.0",
    "mkdocstrings[python]>=0.22.0",

    # Development utilities
    "pre-commit>=3.3.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "httpx>=0.24.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.0",
    "mkdocstrings[python]>=0.22.0",
    "mkdocs-mermaid2-plugin>=1.0.0",
]

all = [
    "nba-predictor-streamlit[dev,test,docs]",
]

[project.urls]
Homepage = "https://github.com/nba-predictor/nba-predictor-streamlit"
Documentation = "https://nba-predictor-streamlit.readthedocs.io"
Repository = "https://github.com/nba-predictor/nba-predictor-streamlit.git"
Issues = "https://github.com/nba-predictor/nba-predictor-streamlit/issues"
Changelog = "https://github.com/nba-predictor/nba-predictor-streamlit/blob/main/CHANGELOG.md"

[project.scripts]
nba-predictor = "nba_predictor.cli:main"
nba-predictor-server = "nba_predictor.server:main"
nba-dev = "startup:main"

[tool.hatch.version]
path = "src/nba_predictor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_predictor"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["nba_predictor"]

# MyPy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Source code paths
[[tool.mypy.overrides]]
module = "nba_predictor.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Ignore errors for external libraries without stubs
[[tool.mypy.overrides]]
module = [
    "joblib.*",
    "sklearn.*",
    "plotly.*",
    "nba_api.*",
    "shap.*",
    "xgboost.*",
    "pandas.*",
    "numpy.*",
    "streamlit.*",
    "seaborn.*",
    "matplotlib.*",
    "requests.*",
    "beautifulsoup4.*",
    "lxml.*",
    "selenium.*",
    "sqlalchemy.*",
    "apscheduler.*",
    "python_telegram_bot.*",
]
ignore_missing_imports = true

# Pytest configuration (Context7-compliant)
[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = "src"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    # "--cov-fail-under=75",  # Context7: Disabled for complex ML system - focus on critical component testing
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/nba_predictor"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"