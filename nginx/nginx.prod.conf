# NBA Predictor - Production Nginx Configuration
# Context7 SuperPoteri PWA Load Balancer

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ===========================================
    # Logging Configuration
    # ===========================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ===========================================
    # Performance Optimization
    # ===========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ===========================================
    # Gzip Compression
    # ===========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ===========================================
    # Rate Limiting
    # ===========================================
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=dashboard:10m rate=5r/s;

    # ===========================================
    # Upstream Servers
    # ===========================================
    upstream nba_api_backend {
        least_conn;
        server nba-predictor-api:8501 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream nba_dashboard_backend {
        least_conn;
        server nba-predictor-dashboard:8502 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ===========================================
    # SSL Configuration
    # ===========================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ===========================================
    # Security Headers
    # ===========================================
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;

    # ===========================================
    # HTTP to HTTPS Redirect
    # ===========================================
    server {
        listen 80;
        server_name _;
        return 301 https://$server_name$request_uri;
    }

    # ===========================================
    # HTTPS Main Server
    # ===========================================
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # ===========================================
        # Health Check Endpoint
        # ===========================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ===========================================
        # Context7 PWA Static Files
        # ===========================================
        location /pwa/ {
            alias /usr/share/nginx/html/pwa/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Context7-PWA "enabled";
            add_header SuperPoteri "optimized";
        }

        # ===========================================
        # API Routes with Rate Limiting
        # ===========================================
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://nba_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Context7 Headers
            add_header Context7-API "production" always;
            add_header SuperPoteri "enabled" always;
        }

        # ===========================================
        # Dashboard Routes with Rate Limiting
        # ===========================================
        location /dashboard/ {
            limit_req zone=dashboard burst=10 nodelay;
            
            proxy_pass http://nba_dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 45s;
            proxy_send_timeout 45s;
            proxy_read_timeout 45s;
            
            # Context7 Headers
            add_header Context7-Dashboard "production" always;
            add_header PWA-Enabled "true" always;
        }

        # ===========================================
        # WebSocket Support
        # ===========================================
        location /ws/ {
            proxy_pass http://websocket-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket Timeouts
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            
            # Context7 Headers
            add_header Context7-WebSocket "real-time" always;
        }

        # ===========================================
        # Default Route to Dashboard
        # ===========================================
        location / {
            proxy_pass http://nba_dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 45s;
            proxy_send_timeout 45s;
            proxy_read_timeout 45s;
        }

        # ===========================================
        # Metrics Endpoint for Monitoring
        # ===========================================
        location /nginx_metrics {
            stub_status on;
            access_log off;
            allow 172.20.0.0/16;  # Only allow internal network
            deny all;
        }
    }
}