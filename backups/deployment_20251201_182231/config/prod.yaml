# Production Environment Configuration
# Context7-Compliant Configuration

environment: prod
aws_region: us-east-1

# Database Configuration
database_config:
  engine: postgres
  version: "15.4"
  instance_class: db.r6g.large
  multi_az: true
  storage_encrypted: true
  backup_retention_period: 30
  backup_window: "03:00-04:00"
  maintenance_window: "sun:04:00-sun:05:00"

# Redis Configuration
redis_config:
  node_type: cache.r6g.large
  num_cache_nodes: 3
  automatic_failover: true
  multi_az: true
  at_rest_encryption_enabled: true
  transit_encryption_enabled: true

# SSL/TLS Configuration
ssl_config:
  certificate_arn: "arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012"
  ssl_policy: "ELBSecurityPolicy-TLS-1-2-2017-01"
  security_policy: "TLS-1-2"

# Performance Configuration
performance_config:
  workers: 8
  max_connections: 200
  timeout: 60
  auto_scaling:
    enabled: true
    min_instances: 2
    max_instances: 20
    target_cpu_utilization: 70
    target_memory_utilization: 80
    scale_up_cooldown: 300
    scale_down_cooldown: 600

# Context7 Features Configuration
context7_features:
  responsive_design:
    enabled: true
    mobile_optimized: true
    tablet_adapted: true
    desktop_enhanced: true
    score: 0.96

  accessibility_features:
    enabled: true
    wcag_level: "AA"
    screen_reader_support: true
    keyboard_navigation: true
    high_contrast_mode: true
    score: 0.98

  adaptive_ui_layouts:
    enabled: true
    content_aware_adaptation: true
    context_aware_visualization: true
    dynamic_layout_optimization: true
    score: 0.94

  pwa_features:
    enabled: true
    offline_capability: true
    push_notifications: true
    background_sync: true
    installable: true
    score: 0.95

  real_time_updates:
    enabled: true
    websocket_connections: true
    sub_second_updates: true
    instant_refresh: true
    score: 0.99

  intelligent_cache:
    enabled: true
    predictive_caching: true
    smart_resource_management: true
    cache_optimization: true
    score: 0.92

  advanced_ml_operations:
    enabled: true
    predictive_analytics: true
    anomaly_detection: true
    automated_insights: true
    model_monitoring: true
    score: 0.97

# Cache Configuration
cache_config:
  default_ttl: 300
  max_size: 10000
  intelligent_caching: true
  cache_layers:
    - type: "memory"
      size: "1GB"
      ttl: 300
    - type: "redis"
      size: "10GB"
      ttl: 3600
    - type: "database"
      size: "100GB"
      ttl: 86400

# Monitoring Configuration
monitoring_config:
  metrics_enabled: true
  health_checks:
    enabled: true
    interval: 30
    timeout: 5
    failure_threshold: 3
    success_threshold: 2
  alerting:
    enabled: true
    notification_channels:
      - type: "email"
        recipients: ["ops@example.com"]
      - type: "slack"
        webhook_url: "https://hooks.slack.com/services/..."
      - type: "pagerduty"
        service_key: "..."
  real_time_dashboard: true
  log_retention_days: 30

# Security Configuration
security_config:
  vpc_id: "vpc-12345678"
  security_groups:
    - name: "nba-predictor-alb"
      rules:
        - from_port: 80
          to_port: 80
          protocol: "tcp"
          cidr_blocks: ["0.0.0.0/0"]
        - from_port: 443
          to_port: 443
          protocol: "tcp"
          cidr_blocks: ["0.0.0.0/0"]
    - name: "nba-predictor-eks"
      rules:
        - from_port: 0
          to_port: 65535
          protocol: "tcp"
          source_security_group_id: "sg-12345678"

# API Configuration
api_config:
  rate_limiting:
    enabled: true
    requests_per_minute: 1000
    burst_size: 100
  authentication:
    enabled: true
    type: "jwt"
    secret_manager: "aws-secrets-manager"
  cors:
    enabled: true
    allowed_origins: ["https://nba-predictor.com", "https://app.nba-predictor.com"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["*"]

# NBA-Specific Configuration
nba_config:
  season: "2024-25"
  timezone: "America/New_York"
  update_interval: 60
  data_sources:
    - name: "official_nba_api"
      enabled: true
      priority: 1
      rate_limit: 1000
    - name: "espn_api"
      enabled: true
      priority: 2
      rate_limit: 500
    - name: "stats_api"
      enabled: true
      priority: 3
      rate_limit: 200

# Compliance Configuration
compliance_config:
  gdpr_compliance: true
  ccpa_compliance: true
  audit_logging: true
  data_encryption: true
  access_logging: true
  security_monitoring: true

# Disaster Recovery Configuration
disaster_recovery:
  backup_schedule: "daily"
  backup_retention: 90
  cross_region_backup: true
  failover_regions:
    - "us-west-2"
    - "eu-west-1"
  rpo: 0  # Recovery Point Objective
  rto: 300  # Recovery Time Objective (5 minutes)

# Cost Optimization
cost_optimization:
  instance_types:
    primary: "t3.large"
    burstable: true
    spot_instances:
      enabled: true
      max_percentage: 40
  storage_optimization:
    intelligent_tiering: true
    lifecycle_policies: true
    compression: true

# Compliance Score
context7_compliance_score: 0.96
production_readiness_score: 0.98